name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Only the newest run per ref matters; cancel older ones. Tags are excluded
# from cancellation so a release build is never killed mid-upload.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # Needed only to create the release on a tag. Harmless on other refs, but
    # scoped at the job level rather than the workflow level all the same.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended \
            texlive-pictures \
            texlive-fonts-recommended \
            make

      - name: Build
        run: make

      # A build that "succeeds" but silently drops frames is worse than a
      # failure, so assert the PDF exists and has a plausible page count.
      - name: Check output
        run: |
          test -f electrical.pdf
          sudo apt-get install -y --no-install-recommends poppler-utils
          pages=$(pdfinfo electrical.pdf | awk '/^Pages:/ {print $2}')
          echo "electrical.pdf: $pages pages"
          test "$pages" -gt 1

      - name: Upload PDF as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: electrical-pdf
          path: electrical.pdf
          if-no-files-found: error

      # Tagging v1, v1.2, v2024-talk, ... publishes a release with the deck
      # attached. Re-running a tag build replaces the asset rather than failing.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          asset="off-grid-electrical-${TAG}.pdf"
          cp electrical.pdf "$asset"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$asset#Off-Grid Electrical (${TAG})" --clobber
          else
            gh release create "$TAG" \
              --title "Off-Grid Electrical ${TAG}" \
              --generate-notes \
              "$asset#Off-Grid Electrical (${TAG})"
          fi
